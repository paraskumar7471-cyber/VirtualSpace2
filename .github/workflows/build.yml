name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'EOFX'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.virtualspace"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.virtualspace"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOFX
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'EOFX'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application android:label="@string/app_name" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Android 12+ provisioning steps -->
                  <activity android:name=".ProvisioningModeActivity" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <intent-filter>
                          <action android:name="android.app.action.GET_PROVISIONING_MODE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".ComplianceActivity" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <intent-filter>
                          <action android:name="android.app.action.ADMIN_POLICY_COMPLIANCE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".AdminReceiver" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                          <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOFX
          mkdir -p 'app/src/main/java/com/example/virtualspace'
          cat > 'app/src/main/java/com/example/virtualspace/AdminReceiver.kt' <<'EOFX'
          package com.example.virtualspace

          import android.app.admin.DeviceAdminReceiver
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent

          class AdminReceiver : DeviceAdminReceiver() {
              override fun onProfileProvisioningComplete(context: Context, intent: Intent) {
                  val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val admin = ComponentName(context, AdminReceiver::class.java)
                  dpm.setProfileName(admin, "Virtual Space")
                  dpm.setProfileEnabled(admin)
                  // Open the app inside the new profile
                  context.startActivity(Intent(context, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
          }
          EOFX
          mkdir -p 'app/src/main/java/com/example/virtualspace'
          cat > 'app/src/main/java/com/example/virtualspace/ComplianceActivity.kt' <<'EOFX'
          package com.example.virtualspace

          import android.app.Activity
          import android.os.Bundle

          class ComplianceActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setResult(RESULT_OK)
                  finish()
              }
          }
          EOFX
          mkdir -p 'app/src/main/java/com/example/virtualspace'
          cat > 'app/src/main/java/com/example/virtualspace/MainActivity.kt' <<'EOFX'
          package com.example.virtualspace

          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var dpm: DevicePolicyManager
              private lateinit var admin: ComponentName
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  admin = ComponentName(this, AdminReceiver::class.java)

                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 60, 40, 40) }
                  status = TextView(this).apply { textSize = 16f }
                  root.addView(status)

                  val isProfile = dpm.isProfileOwnerApp(packageName)
                  if (!isProfile) {
                      root.addView(Button(this).apply {
                          text = "Virtual Space बनाएँ (Work Profile)"
                          setOnClickListener { createProfile() }
                      })
                      status.text = "अभी Virtual Space नहीं है। नीचे बटन दबाकर बनाएँ।"
                  } else {
                      status.text = "आप Virtual Space (Work Profile) के अंदर हैं।\nयहाँ इंस्टॉल किए ऐप मुख्य फ़ोन से अलग रहते हैं।"
                      val pkg = EditText(this).apply { hint = "पैकेज नाम, जैसे com.whatsapp" }
                      root.addView(pkg)
                      root.addView(Button(this).apply {
                          text = "सिस्टम ऐप यहाँ चालू करें"
                          setOnClickListener {
                              try {
                                  dpm.enableSystemApp(admin, pkg.text.toString().trim())
                                  toast("चालू हो गया")
                              } catch (e: Exception) { toast("नहीं हुआ: ${e.message}") }
                          }
                      })
                      root.addView(Button(this).apply {
                          text = "APK फ़ाइल चुनकर इंस्टॉल करें"
                          setOnClickListener {
                              startActivityForResult(Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = "application/vnd.android.package-archive"
                              }, 1)
                          }
                      })
                  }
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              private fun createProfile() {
                  val intent = Intent(DevicePolicyManager.ACTION_PROVISION_MANAGED_PROFILE).apply {
                      putExtra(DevicePolicyManager.EXTRA_PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME, admin)
                  }
                  if (intent.resolveActivity(packageManager) != null) startActivityForResult(intent, 2)
                  else toast("आपका फ़ोन Work Profile सपोर्ट नहीं करता")
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1 && resultCode == RESULT_OK && data?.data != null) {
                      val uri: Uri = data.data!!
                      startActivity(Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      })
                  }
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()
          }
          EOFX
          mkdir -p 'app/src/main/java/com/example/virtualspace'
          cat > 'app/src/main/java/com/example/virtualspace/ProvisioningModeActivity.kt' <<'EOFX'
          package com.example.virtualspace

          import android.app.Activity
          import android.app.admin.DevicePolicyManager
          import android.content.Intent
          import android.os.Bundle

          class ProvisioningModeActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val result = Intent().putExtra(
                      DevicePolicyManager.EXTRA_PROVISIONING_MODE,
                      DevicePolicyManager.PROVISIONING_MODE_MANAGED_PROFILE
                  )
                  setResult(RESULT_OK, result)
                  finish()
              }
          }
          EOFX
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/strings.xml' <<'EOFX'
          <resources><string name="app_name">Virtual Space</string></resources>
          EOFX
          mkdir -p 'app/src/main/res/xml'
          cat > 'app/src/main/res/xml/device_admin.xml' <<'EOFX'
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies />
          </device-admin>
          EOFX
          cat > 'build.gradle.kts' <<'EOFX'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOFX
          cat > 'gradle.properties' <<'EOFX'
          org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOFX
          mkdir -p 'gradle/wrapper'
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'EOFX'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOFX
          cat > 'settings.gradle.kts' <<'EOFX'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VirtualSpace"
          include(":app")
          EOFX
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualSpace-apk
          path: app/build/outputs/apk/debug/*.apk
